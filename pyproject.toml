[project]
name = "ana-tokutabi-watcher"
version = "0.1.0"
description = "ANA 今週のトクたびマイル 大阪発着路線検出・空席監視・Discord通知"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "apscheduler>=3.10.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.0",
    "sqlalchemy>=2.0.0",
    "tenacity>=8.2.0",
    "structlog>=24.0.0",
    "python-dotenv>=1.0.0",
    "typer>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "httpx>=0.27.0",
    "types-pyyaml",
]

[project.scripts]
ana-tokutabi = "ana_tokutabi_watcher.main:app"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/ana_tokutabi_watcher"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
